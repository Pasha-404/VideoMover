plugins {
    alias(libs.plugins.android.application)
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { propName, envName ->
    signingProperties.getProperty(propName) ?: System.getenv(envName)
}
def releaseStoreFilePath = signingValue("storeFile", "VIDEOMOVER_STORE_FILE")
def releaseStorePassword = signingValue("storePassword", "VIDEOMOVER_STORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "VIDEOMOVER_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "VIDEOMOVER_KEY_PASSWORD")
def releaseStoreFile = releaseStoreFilePath ? rootProject.file(releaseStoreFilePath) : null
def hasReleaseSigning = releaseStoreFile != null
        && releaseStoreFile.exists()
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword

android {
    namespace 'ru.pavelkuzmin.videomover'
    compileSdk 35

    defaultConfig {
        applicationId "ru.pavelkuzmin.videomover"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.documentfile
    implementation libs.preference

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
